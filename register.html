<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Your Scorpian</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<div class="auth-container">

    <div class="auth-box">

        <div class="auth-logo">
            🦂
        </div>

        <h1>
            Create Your Scorpian
        </h1>

        <p class="auth-description">
            Create your personal space for
            everything you create.
        </p>


        {% if message %}

        <div class="message">
            {{ message }}
        </div>

        {% endif %}


        <form method="POST">


            <label>
                Name
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter your name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >

                Create Scorpian

            </button>

        </form>


        <p class="auth-switch">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>


        <a href="/" class="back-home">
            ← Back to Scorpian
        </a>

    </div>

</div>


</body>

</html>
